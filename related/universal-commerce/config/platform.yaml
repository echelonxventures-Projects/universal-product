version: "1.0.0"
tenant:
  isolation: "separate"
  max_tenants: 10000
security:
  auth: "oauth2"
  mfa: "optional"
  encryption: "AES-256"
observability:
  metrics: "prometheus"
  traces: "jaeger"
  logs: "structured-json"
features:
  aiCommerce: true
  marketplaceFederation: true
  agentProtocol: true
  retailMedia: true
