apiVersion: v1
kind: Service
metadata:
  name: uci-api
  labels:
    app: uci-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: uci-api

---
apiVersion: v1
kind: Service
metadata:
  name: uci-api-internal
  labels:
    app: uci-api
    internal: "true"
spec:
  type: ClusterIP
  ports:
  - port: 3000
    protocol: TCP
    name: grpc
  selector:
    app: uci-api
