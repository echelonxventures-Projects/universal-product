# --- TASK-000009: test + coverage configuration ---------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# UCOS-CL-008 — intelligence/tests joins the canonical collection.
#
# The determination this settles: intelligence/ IS part of the certified corpus. It is not
# a side lane. UCOS-RIE-001 emits ELEVEN TRACKED artifacts under intelligence/ that the
# RIB → AEE → P0-FCL-002 chain consumes as evidence, and Phase-9 certifies their bytes. A
# producer of certified artifacts whose tests never run in the certifying command is a
# capability the certification does not actually cover.
#
# Measured consequence of its absence: the coverage-isolation regression added at be46a300
# lived in intelligence/tests/test_rie.py and was therefore collected by NOTHING —
# not ./verify.sh, not CI, not the certification pipeline. The invariant it claimed to
# guard was unguarded, and the residual leak through analysis.py (UCOS-CL-005) shipped
# under it. Adding the path is what makes that regression real rather than decorative.
#
# The coverage DENOMINATOR is deliberately a separate question, answered separately below:
# these tests entering collection does not by itself put intelligence/* into --cov.
#
# --- UCI-000001: four more test roots that were collected by NOTHING -------------------
#
# The same defect as intelligence/tests, four more times and at twenty times the scale.
# Measured: service/tests, data/tests, application/tests and infrastructure/tests hold 188
# test modules and 3,995 tests. They were named in no testpaths, no Makefile target, no
# verify.sh stage and no workflow. Every one of them passes, in 14.7 seconds combined.
#
# That combination is the worst possible one. A reader who opens data/tests and finds 954
# passing tests concludes the layer is tested; no gate anywhere executed a line of it. Tests
# that exist and never run are worse than absent tests, because absence is visible.
#
# The four source layers they cover enter --cov below in the same edit. Admitting the tests
# without admitting the code would put 3,995 passing tests against a denominator that still
# excluded what they exercise, which would raise the reported percentage while measuring
# nothing new -- the precise move Rule 1 of the closure mandate names as a defect.
# --- UCOS-OMEGA-001 (Ω-1) — THE COLLECTION SET AND THE DENOMINATOR ARE DERIVED -----------
#
# `testpaths` USED TO BE DECLARED HERE, and 78 `--cov=` flags with it. Both are gone, and the
# reason is the measurement that produced Ω-1 rather than a preference for shorter files.
#
# WHAT THE THREE LISTS COST. This file carried the same fact three times: `testpaths` named the
# test roots, `addopts` named 78 packages, and `[tool.coverage.run] source` named 78 paths.
# Three enumerations, reconciled by nobody, and each one silently wrong at a different moment:
#
#   engine.enforcement_closure, engine.constitution, engine.uicm   in NEITHER --cov list
#     4,580 statements, 5.2% of the tree, outside a denominator reporting 97%
#   service, data, application, infrastructure, intelligence       no testpaths entry
#     188 test modules and 3,995 PASSING tests that no runner collected, for months
#   engine/recursive_knowledge                                     no __init__.py, so invisible
#     2,849 statements behind a live gate, a verify.sh stage, a workflow and 135 tests
#   scripts/                                                       never in any list at all
#     found by discovery on its first run, having been outside every enumeration since it existed
#
# Four omissions, one root cause: a list of what exists agrees with itself forever. It has no
# term for what it leaves out, so it cannot report its own incompleteness — and every one of the
# omissions above was found by READING the lists, never by a control firing.
#
# WHAT REPLACES THEM. `engine/universal_discovery/pytest_scope.py` derives both sets from
# `git ls-files '*.py'` before pytest-cov starts its collector: the test roots from which
# directories hold suites, and the denominator from which packages hold source. There is now ONE
# derivation, so drift between the copies is not a thing that is checked for — it is a thing that
# cannot occur.
#
# THE PROPERTY THIS BUYS, which is the whole point: adding `quantum/` — or `mars/`, or
# `interstellar/` — is governed on the commit that creates it, with ZERO edits to this file, zero
# registration and zero code changes. `platform/tests/test_coverage_scope.py` proves that by
# creating such a tree and measuring that discovery already accounts for it.
#
# WHAT IS STILL DECLARED HERE, AND WHY THAT IS CORRECT. Judgements, never populations. The
# coverage floor is a policy. `[tool.ucos.coverage_scope] excluded_packages` is an owner's
# argued decision that something stay outside measurement, and Ω-5 REQUIRES it to be written
# down: a silent exclusion is the defect, an arguable one is the remedy.
addopts = [
  "-ra",
  "--strict-markers",
  # Ω-1. Loaded with `-p` so it registers before the entry-point plugins, and implemented as a
  # HOOKWRAPPER so it runs ahead of pytest-cov's own `tryfirst` hook. Both details are
  # load-bearing; the module docstring states what breaks if either changes.
  "-p",
  "engine.universal_discovery.pytest_scope",
  # NO `--cov-report=term-missing` HERE, AND THE REASON IS THAT A PER-SHARD TABLE IS A LIE.
  # pytest-cov stores reports in a dict keyed by type (`StoreReport`), so a report named in
  # `addopts` reaches EVERY sharded invocation and cannot be removed from the command line —
  # naming a type again replaces it, and there is no spelling that deletes one. UVI exploits
  # that to redirect `xml` to a shard-private path; `term-missing` had no such escape, so all
  # thirteen shards rendered a full table.
  #
  # Each of those tables measures the WHOLE denominator against ONE THIRTEENTH of the suite,
  # so each reports 19%-57% and names tens of thousands of statements as missed that another
  # shard covers. Fifteen thousand eight hundred and ninety of a 17,827-line verification log
  # were those rows: 89% of the output, every line of it inviting the reader to fix a miss
  # that does not exist. That is not verbosity, it is a measurement presented at a scope where
  # it is false, and it was read that way.
  #
  # The combined table -- the only one that means anything -- is rendered by the declared
  # `coverage report` stage (verify.sh), which invokes the coverage CLI directly and does not
  # consult `addopts` at all. Nothing is lost here and one true table survives. A developer who
  # wants the table interactively runs `python -m coverage report` after the suite, which is
  # the same command that stage runs.
  # WITHOUT THIS, EVERY SUBPROCESS WRITES COVERAGE DATA THAT CAN NEVER BE COMBINED, AND THE
  # PROOF IS ONE ENVIRONMENT VARIABLE. pytest-cov exports the config path to child processes in
  # `CovController.set_env` (pytest_cov/engine.py:111) so its `.pth` can restart coverage there,
  # but ONLY if the path exists: otherwise it exports the sentinel `COV_CORE_CONFIG=':'`, meaning
  # "no config file". The default is `.coveragerc`, this repository has none, and `branch = true`
  # lives in `[tool.coverage.run]` BELOW — so every child started coverage with branch mode OFF
  # and wrote `has_arcs=0` data beside a parent writing `has_arcs=1`.
  #
  # `coverage combine` refuses that pair outright: `DataError: Can't combine statement coverage
  # data with branch data`. It surfaces as an INTERNALERROR during pytest-cov's teardown, AFTER
  # every test in the shard has PASSED, so the shard reports "1404 passed" and then dies — and
  # the coverage gate reports a number computed from whichever shards happened to survive. It was
  # measured at 71% against a true 98%: not a low number, a meaningless one.
  #
  # Naming the config here makes the path exist, so the child resolves it, reads `branch = true`
  # and writes branch data that combines. Verified by probe: `has_arcs` goes 0 -> 1. The path is
  # relative and that is safe — `set_env` calls `Path.resolve()` before exporting, so a child that
  # chdirs still receives an absolute path.
  #
  # THIS IS THE GENERAL FIX AND IT DID NOT REPLACE THE SPECIFIC ONE. `immutable.clean_environment`
  # strips this bootstrap from UCI's own measuring subprocesses, which is a different obligation:
  # a subprocess whose PURPOSE is to measure something must not also contribute to the outer
  # session's data file, whatever format it would write. Both are correct and both stay.
  "--cov-config=pyproject.toml",
  "--cov-report=xml",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
# `source` IS DELIBERATELY ABSENT. It was the second of the three enumerations described above —
# 78 paths that had to agree with 78 flags and were reconciled by nobody. pytest-cov passes the
# derived denominator to coverage explicitly, so a `source` here would be a stale second opinion
# that only ever spoke when the two disagreed. Deleting it does not widen the denominator; it
# removes a copy of it. `python -m engine.universal_discovery --scope` prints what is measured.
#
# `omit` is PATTERNS, not paths, and that distinction is the Ω-1 property applied here: a suite
# under a tree nobody has created yet is already omitted, because the pattern does not name a
# tree. A test module is not source under measurement — counting it would let a suite raise its
# own coverage by growing, which is the one way to make the number go up while measuring less.
omit = [
  "*/tests/*",
  "*/conftest.py",
]

# --- UCOS-COV-SCOPE-001 — the coverage denominator, declared rather than assumed ---------
#
# WHY THIS TABLE EXISTS, STATED AS THE MEASUREMENT THAT PRODUCED IT. The scope was declared
# TWICE and reconciled by nobody: `addopts` carries 69 `--cov=` flags and `[tool.coverage.run]
# source` carries 69 paths, two independent lists that happened to agree. A package could be
# dropped from one and kept in the other, or omitted from both, and no gate anywhere would
# notice. Three packages WERE omitted from both — engine.enforcement_closure (711 statements),
# engine.constitution (1,976) and engine.uicm (1,893) — 4,580 statements, 5.2% of the source
# tree, silently outside a denominator that was reporting 97%.
#
# A percentage whose denominator is not itself governed is not a measurement, it is a number.
# So: every package under engine/ and platform/ is either MEASURED or named here with a reason,
# and platform/tests/test_coverage_scope.py refuses any third possibility in both directions —
# a package in neither, and a stale entry naming a package that is measured or gone.
[tool.ucos.coverage_scope]
excluded_packages = [
  { package = "engine.uicm", reason = "1,893 statements across ten modules with ZERO test files, and no module under engine/, platform/ or 00-MASTER/ imports it. Admitting it to the denominator would bake in ~1,893 permanently uncovered statements and convert a dead-code finding into a coverage figure, which is measurement laundering. Excluding it silently was how it stayed invisible. It is named here so the omission is arguable: the open question is whether this package is retired and should be deleted, or live and should be tested, and that is an owner decision rather than a coverage setting. Reviewed: 2026-08-28." },
  { package = "engine.substrate", reason = "194 statements that no environment can execute until the substrate exists: the package imports uakp>=0.0.1, which sub-declaration records as publishing no release yet, so engine.substrate answers FAULT (exit 2) by design and engine/tests/unit/test_substrate_consumption.py importorskips on exactly that fact. The code is not untested because nobody looked; it is untestable while its subject is absent, and a percentage charged to an unpublished upstream is a number about the environment, not the repository. Named here so the omission is arguable, the same shape as engine.uicm: when uakp is installable, this entry is deleted and the suite runs for real. Reviewed: 2026-09-12." },
]


[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# --- Lint / secure-coding (CD-01 conventions, CD-04 secure coding) ---------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import-sort, B bugbear, UP pyupgrade, S bandit (security).
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and secret-like literals in fixtures (S105/S106).
"engine/tests/*" = ["S101", "S105", "S106"]
"platform/tests/*" = ["S101", "S105", "S106"]
