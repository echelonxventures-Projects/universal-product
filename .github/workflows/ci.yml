name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.13 is the floor: node:sqlite is behind --experimental-sqlite before it
        node: [22.13, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # the browser-level suites (test/console, smoke, roles, navfit, …) drive the pages
      # through jsdom, a devDependency — without the install `npm test` dies on require
      - name: Install
        run: npm ci
      - name: Syntax + E2E suite (own DB/port)
        run: npm test
      - name: Boot smoke (fresh DB, healthz)
        run: |
          LX_DB=/tmp/ci.db PORT=3055 nohup node server.js >/tmp/ci.log 2>&1 &
          for i in $(seq 1 30); do sleep 1; curl -sf http://localhost:3055/healthz && break; done
          curl -sf http://localhost:3055/healthz >/dev/null && echo OK
      - name: Docker image builds
        if: matrix.node == 22
        run: docker build -t luxora-ci .
