apiVersion: apps/v1
kind: Deployment
metadata:
  name: uci-api
  labels:
    app: uci-api
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: uci-api
  template:
    metadata:
      labels:
        app: uci-api
    spec:
      containers:
      - name: api
        image: uci-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: uci-config
              key: tenant_id
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
